services:
  nginx:
    build: requirements/nginx/.
    image: nginx
    container_name: nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
      - ./requirements/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - wordpress
    networks:
      - Inception

  wordpress:
    build: requirements/wordpress/.
    image: wordpress
    container_name: wp-php
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DOMAIN: ${DOMAIN}
      WP_NAME: ${WP_NAME}
      WP_DBUSER: ${WP_DBUSER}
      WP_PASSWORD: ${WP_PASSWORD}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_USER: ${WP_USER}
      WP_EMAIL: ${WP_EMAIL}
      WP_USER_PASSWORD: ${WP_USER_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - Inception

  mariadb:
    build: requirements/mariadb/.
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    environment:
      WP_NAME: ${WP_NAME}
      WP_DBUSER: ${WP_DBUSER}
      WP_PASSWORD: ${WP_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - Inception

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ngoyat/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ngoyat/data/mariadb

networks:
  Inception:
    driver: bridge